<!DOCTYPE html>
<html>
<head>
    <title>Boot Screen Test</title>
    <style>
        body { margin: 0; padding: 0; background: #0a0a0a; color: white; }
        .boot { 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center;
        }
        .progress {
            width: 300px;
            height: 4px;
            background: #333;
            margin: 20px 0;
        }
        .progress-bar {
            width: 30%;
            height: 100%;
            background: #FD1E4A;
            animation: load 3s forwards;
        }
        @keyframes load {
            to { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="boot">
        <h1 style="color: #FD1E4A">HYPERXGEN</h1>
        <p>OMEGA_CORE_ACTIVE</p>
        <p>ENGINE_V5.2</p>
        <div class="progress">
            <div class="progress-bar"></div>
        </div>
        <p>LOADING... 30%</p>
    </div>
</body>
</html>
