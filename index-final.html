<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HYPERXGEN | Synthesis Engine</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: white; font-family: system-ui; }
        
        .container {
            width: 100vw;
            min-height: 100vh;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .title {
            color: #FD1E4A;
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 10px;
        }
        
        .status {
            color: #0afd1e;
            font-family: monospace;
            margin: 10px 0;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .module {
            background: rgba(30,30,30,0.9);
            border: 1px solid #FD1E4A;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .module:hover {
            transform: translateY(-5px);
            border-color: #FABD0D;
        }
        
        .module h3 {
            color: #FD1E4A;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #666;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">HYPERXGEN</h1>
            <div class="status">OMEGA_CORE_ACTIVE</div>
            <div class="status">ENGINE_V5.2 | Stability_Core: 100%_OK</div>
        </div>
        
        <div class="grid">
            <div class="module" onclick="alert('VECTOR engine engaged')">
                <h3>VECTOR</h3>
                <p>GEOMETRIC SYNTH</p>
            </div>
            <div class="module" onclick="alert('EXTRACT engine engaged')">
                <h3>EXTRACT</h3>
                <p>STYLE THIEF</p>
            </div>
            <div class="module" onclick="alert('MONO engine engaged')">
                <h3>MONO</h3>
                <p>VISUAL CORE</p>
            </div>
            <div class="module" onclick="alert('FILTER engine engaged')">
                <h3>FILTER</h3>
                <p>SPECTRAL UNIT</p>
            </div>
            <div class="module" onclick="alert('TYPO engine engaged')">
                <h3>TYPO</h3>
                <p>KINETIC ENGINE</p>
            </div>
            <div class="module" onclick="alert('AUDIT engine engaged')">
                <h3>AUDIT</h3>
                <p>COMPLIANCE</p>
            </div>
        </div>
        
        <div class="footer">
            ARCHITECTURAL_ENGINE | PROTOCOL_LOCKED<br>
            <span style="font-size: 0.7rem; color: #333;">Static version - instant load</span>
        </div>
    </div>
    
    <script>
        console.log('Static HYPERXGEN loaded instantly');
        // Add interactivity
        document.querySelectorAll('.module').forEach(module => {
            module.addEventListener('click', function() {
                this.style.background = 'rgba(253, 30, 74, 0.1)';
                setTimeout(() => {
                    this.style.background = '';
                }, 300);
            });
        });
    </script>
</body>
</html>
