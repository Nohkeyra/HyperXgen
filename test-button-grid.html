<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./fix-scattered-buttons.css">
    <style>
        /* Simulate your flex: 1 issue */
        .problem-container {
            display: flex;
            flex-wrap: wrap;
            padding: 20px;
        }
        .problem-button {
            display: flex;
            flex-direction: column;
            flex: 1;
            margin: 10px;
            padding: 15px;
            background: #3b82f6;
            color: white;
            border-radius: 8px;
            min-height: 60px;
        }
    </style>
</head>
<body>
    <h2>Before Fix (Scattered - Your Current Issue)</h2>
    <div class="problem-container">
        <button class="problem-button">VECTOR</button>
        <button class="problem-button">EXTRACT</button>
        <button class="problem-button">MONO</button>
        <button class="problem-button">FILTER</button>
        <button class="problem-button">TYPO</button>
        <button class="problem-button">AUDIT</button>
    </div>
    
    <h2 style="margin-top: 40px;">After Fix (Grid Layout)</h2>
    <div class="fixed-container">
        <button>VECTOR</button>
        <button>EXTRACT</button>
        <button>MONO</button>
        <button>FILTER</button>
        <button>TYPO</button>
        <button>AUDIT</button>
    </div>
    
    <script>
        // Apply our fix to the "before" example
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.querySelector('.problem-container');
            container.style.display = 'grid';
            container.style.gridTemplateColumns = 'repeat(3, 1fr)';
            container.style.gap = '15px';
            
            const buttons = document.querySelectorAll('.problem-button');
            buttons.forEach(btn => {
                btn.style.flex = 'none';
                btn.style.width = '100%';
                btn.style.margin = '0';
            });
        });
    </script>
</body>
</html>
