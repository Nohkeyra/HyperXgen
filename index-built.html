<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HYPERXGEN</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: white; }
        #app { width: 100vw; height: 100vh; }
    </style>
    <!-- LOAD PRE-BUILT FILES -->
    <link rel="stylesheet" href="./dist/assets/index-*.css">
</head>
<body>
    <div id="app">
        <!-- Loading placeholder -->
        <div style="width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center;">
            <div style="text-align: center;">
                <h1 style="color: #FD1E4A;">HYPERXGEN</h1>
                <p>Loading optimized bundle...</p>
            </div>
        </div>
    </div>
    
    <!-- Load pre-built JavaScript -->
    <script type="module">
        // Find the built JS file
        async function loadBuiltApp() {
            try {
                // The built entry point
                const module = await import('./dist/assets/index-*.js');
                console.log('Pre-built app loaded');
            } catch (error) {
                console.error('Failed to load built app:', error);
            }
        }
        
        loadBuiltApp();
    </script>
</body>
</html>
