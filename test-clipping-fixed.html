<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            width: 100vw; 
            min-height: 100vh; 
            background: #0a0a0f; 
            color: #00ff88;
            font-family: monospace;
            padding: 20px;
            overflow-x: hidden;
        }
        .container { width: 100%; }
        h1 { font-size: 1.8rem; margin: 10px 0; text-align: center; }
        h2 { font-size: 1.2rem; margin: 8px 0; }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
            margin: 20px 0;
        }
        .panel {
            background: rgba(0,40,40,0.8);
            border: 1px solid #00ff88;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>HYPERXGEN</h1>
        <h2>OMEGA_CORE_ACTIVE</h2>
        <p>ENGINE_V5.2</p>
        
        <div class="grid">
            <div class="panel"><h3>VECTOR</h3><p>GEOMETRIC SYNTH</p></div>
            <div class="panel"><h3>EXTRACT</h3><p>STYLE THIEF</p></div>
            <div class="panel"><h3>MONO</h3><p>VISUAL CORE</p></div>
            <div class="panel"><h3>FILTER</h3><p>SPECTRAL UNIT</p></div>
            <div class="panel"><h3>TYPO</h3><p>KINETIC ENGINE</p></div>
            <div class="panel"><h3>AUDIT</h3><p>COMPLIANCE</p></div>
        </div>
        
        <div style="text-align: center; margin-top: 20px;">
            <p>ARCHITECTURAL_ENGINE</p>
            <p>PROTOCOL_LOCKED</p>
        </div>
    </div>
</body>
</html>
